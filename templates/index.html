<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QuickCalc • Smart Calculator</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <style>
    :root {
      --accent-1: #ff4ecd;
      --accent-2: #00e5ff;
      --accent-3: #00f59b;
      --danger: #ff3b5c;
      --glass-border: rgba(255, 255, 255, 0.16);
      --text-main: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.68);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      background: linear-gradient(-45deg, #0f0c29, #2b1055, #1b3b6f, #0d324d);
      background-size: 400% 400%;
      animation: gradientFlow 12s ease infinite;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .app-shell {
      width: 100%;
      height: 100%;
      max-width: 480px;
      position: relative;
      overflow: hidden;
      background: rgba(12, 14, 30, 0.7);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 500px) {
      .app-shell {
        height: 92dvh;
        border-radius: 28px;
        border: 1px solid var(--glass-border);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
      }
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
      z-index: -1;
    }

    /* ================= 1. STEALTH CALCULATOR ================= */
    #calc-screen {
      padding: 24px 20px;
      justify-content: flex-end;
      background: rgba(10, 12, 26, 0.85);
    }

    .calc-brand {
      position: absolute;
      top: 20px;
      left: 22px;
      font-size: 0.9rem;
      color: var(--text-dim);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .calc-display-wrap { text-align: right; padding: 20px 10px 28px; }
    .calc-expr { font-size: 1.1rem; color: var(--text-dim); min-height: 24px; word-break: break-all; }

    .calc-value {
      font-size: 3.4rem;
      font-weight: 600;
      margin-top: 6px;
      word-break: break-all;
      background: linear-gradient(90deg, #fff, #b8f2ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

    .calc-btn {
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 1.45rem;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calc-btn:active { transform: scale(0.9); }
    .calc-btn.op { background: rgba(0, 229, 255, 0.18); color: #70f3ff; }
    .calc-btn.fn { background: rgba(255, 78, 205, 0.18); color: #ff9be4; }
    .calc-btn.eq {
      background: linear-gradient(135deg, #ff4ecd, #00e5ff);
      color: #0b0d1f;
      font-weight: 700;
      box-shadow: 0 8px 22px rgba(0, 229, 255, 0.35);
    }
    .calc-btn.zero { grid-column: span 2; aspect-ratio: auto; border-radius: 999px; }

    /* ================= 2. ROOM LOGIN ================= */
    #login-screen { justify-content: center; padding: 28px; gap: 16px; }

    .vault-badge {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      margin: 0 auto 6px;
      background: linear-gradient(135deg, #ff4ecd, #00e5ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #0d1024;
      box-shadow: 0 0 30px rgba(255, 78, 205, 0.5);
      animation: floatPulse 3s ease-in-out infinite;
    }

    @keyframes floatPulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.04); }
    }

    .login-title {
      text-align: center;
      font-size: 1.7rem;
      font-weight: 700;
      background: linear-gradient(90deg, #ff79dc, #5cf2ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-sub { text-align: center; font-size: 0.86rem; color: var(--text-dim); margin-bottom: 6px; }

    .input-box {
      width: 100%;
      padding: 15px 18px;
      border-radius: 18px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-box:focus { border-color: var(--accent-2); box-shadow: 0 0 16px rgba(0, 229, 255, 0.25); }
    .input-box::placeholder { color: rgba(255, 255, 255, 0.45); }

    .primary-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #00f59b, #00e5ff);
      color: #081221;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(0, 229, 255, 0.35);
      transition: transform 0.15s ease;
    }

    .primary-btn:active { transform: scale(0.96); }
    .error-msg { color: #ff7a90; font-size: 0.88rem; text-align: center; min-height: 20px; }
    .back-calc-link { text-align: center; color: var(--text-dim); font-size: 0.85rem; cursor: pointer; margin-top: 4px; }

    /* ================= 3. WHATSAPP-STYLE CHAT SCREEN ================= */
    #chat-screen { display: flex; flex-direction: column; }

    .chat-header {
      padding: 11px 12px;
      background: rgba(20, 22, 46, 0.9);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 10;
    }

    .partner-info { display: flex; align-items: center; gap: 9px; min-width: 0; }

    .back-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar-wrap { position: relative; width: 42px; height: 42px; flex-shrink: 0; }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff4ecd, #7a5cff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      box-shadow: 0 4px 14px rgba(255, 78, 205, 0.35);
    }

    .status-dot {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 2px solid #14162e;
      background: #888;
      transition: background 0.3s;
    }

    .status-dot.live { background: #00f59b; box-shadow: 0 0 10px #00f59b; }
    .partner-text { min-width: 0; }
    .partner-name { font-weight: 700; font-size: 0.98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .partner-status { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; transition: color 0.2s; }
    .partner-status.live { color: #00f59b; font-weight: 600; }
    .partner-status.typing { color: #00e5ff; font-weight: 600; animation: pulseText 1s infinite; }

    @keyframes pulseText {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    .header-actions { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }

    .circle-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 0.92rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s;
    }

    .circle-icon-btn:active { transform: scale(0.88); }
    .btn-voice { background: linear-gradient(135deg, #00c853, #00e5ff); color: #06131f; }
    .btn-video { background: linear-gradient(135deg, #ff4ecd, #ff9a3c); color: #16091f; }
    .btn-knock { background: rgba(255, 214, 0, 0.24); color: #ffe066; }
    .btn-panic { background: linear-gradient(135deg, #ff3b5c, #ff0040); color: #fff; box-shadow: 0 0 12px rgba(255, 59, 92, 0.45); }

    .privacy-bar {
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.28);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-dim);
      gap: 6px;
    }

    .pill-toggle {
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      cursor: pointer;
      font-size: 0.7rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .pill-toggle.active {
      background: rgba(255, 78, 205, 0.32);
      border-color: #ff4ecd;
      color: #ffb8ee;
    }

    /* Chat Messages Area */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: filter 0.25s ease;
    }

    .messages-area.blurred { filter: blur(14px); user-select: none; }

    .msg-row {
      display: flex;
      align-items: center;
      width: 100%;
      position: relative;
    }

    .msg-row.me { justify-content: flex-end; }
    .msg-row.them { justify-content: flex-start; }

    .swipe-reply-hint {
      position: absolute;
      left: 6px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(0, 229, 255, 0.22);
      color: #70f3ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.15s, transform 0.15s;
      pointer-events: none;
    }

    .msg-bubble {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
      animation: popIn 0.22s ease;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
      will-change: transform;
    }

    .msg-bubble.sticker-bubble {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 4px 6px;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(10px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes highlightFlash {
      0% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0.85); }
      100% { box-shadow: 0 0 0 14px rgba(0, 229, 255, 0); }
    }

    .msg-bubble.highlight-flash { animation: highlightFlash 0.7s ease; }

    .msg-bubble.me {
      background: linear-gradient(135deg, #7f00ff, #e100ff);
      color: #fff;
      border-bottom-right-radius: 6px;
      box-shadow: 0 6px 18px rgba(225, 0, 255, 0.22);
    }

    .msg-bubble.them {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      border-bottom-left-radius: 6px;
    }

    /* Quoted Reply inside Bubble */
    .quoted-reply {
      background: rgba(0, 0, 0, 0.28);
      border-left: 3px solid #00e5ff;
      border-radius: 10px;
      padding: 6px 9px;
      margin-bottom: 6px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .quoted-reply-sender {
      font-weight: 700;
      color: #70f3ff;
      font-size: 0.72rem;
      margin-bottom: 2px;
    }

    .quoted-reply-text {
      opacity: 0.85;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 210px;
    }

    .msg-meta {
      font-size: 0.67rem;
      opacity: 0.85;
      margin-top: 5px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
    }

    .seen-indicator {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
    }

    .seen-indicator.is-seen {
      color: #00f5ff;
      text-shadow: 0 0 8px rgba(0, 245, 255, 0.55);
    }

    .edited-tag { font-style: italic; opacity: 0.85; }

    .sys-pill {
      align-self: center;
      font-size: 0.73rem;
      background: rgba(0, 229, 255, 0.14);
      border: 1px solid rgba(0, 229, 255, 0.25);
      color: #9ff6ff;
      padding: 5px 12px;
      border-radius: 999px;
      text-align: center;
    }

    .knock-pill {
      align-self: center;
      font-size: 0.82rem;
      font-weight: 600;
      background: linear-gradient(135deg, rgba(255, 214, 0, 0.28), rgba(255, 78, 205, 0.28));
      border: 1px solid rgba(255, 214, 0, 0.5);
      color: #fff3b0;
      padding: 7px 15px;
      border-radius: 999px;
      text-align: center;
    }

    /* Animated Sticker Card in Chat */
    .sticker-visual {
      width: 128px;
      padding: 12px 10px;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      animation: stickerBounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes stickerBounce {
      0% { transform: scale(0.4) rotate(-8deg); opacity: 0; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    .sticker-emoji {
      font-size: 3.1rem;
      line-height: 1.05;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35));
      animation: floatPulse 2.4s ease-in-out infinite;
    }

    .sticker-label {
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    /* Media & File Cards */
    .chat-img-preview { max-width: 100%; max-height: 240px; border-radius: 14px; display: block; cursor: pointer; margin-bottom: 6px; }
    .chat-video-preview { max-width: 100%; max-height: 220px; border-radius: 12px; display: block; margin-bottom: 6px; background: #000; }
    .chat-audio-preview { width: 220px; max-width: 100%; height: 36px; margin-bottom: 6px; }

    .file-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.22);
      padding: 9px 11px;
      border-radius: 14px;
      margin-bottom: 6px;
    }

    .file-card-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(0, 229, 255, 0.2);
      color: #70f3ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .file-card-info { min-width: 0; flex: 1; }
    .file-card-name { font-size: 0.86rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-card-size { font-size: 0.7rem; opacity: 0.72; }

    .save-file-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 13px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #00f59b, #00e5ff);
      color: #061422;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 2px;
    }

    .view-once-card { display: flex; align-items: center; gap: 9px; cursor: pointer; font-weight: 600; padding: 2px 0; }
    .view-once-card.opened { opacity: 0.55; cursor: default; font-style: italic; font-weight: 400; }

    /* Context Strip above Input (Reply / Edit / File) */
    .composer-banner {
      padding: 8px 14px;
      background: rgba(24, 28, 58, 0.96);
      border-top: 1px solid rgba(0, 229, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.82rem;
    }

    .composer-banner.hidden { display: none; }
    .banner-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .banner-thumb { width: 36px; height: 36px; border-radius: 10px; object-fit: cover; border: 1px solid rgba(255, 255, 255, 0.25); }
    .banner-text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .banner-close {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 59, 92, 0.24);
      color: #ff8599;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ================= EMOJI & STICKER TRAY ================= */
    .emoji-sticker-tray {
      background: rgba(14, 16, 36, 0.97);
      border-top: 1px solid var(--glass-border);
      display: none;
      flex-direction: column;
      height: 240px;
      animation: popIn 0.18s ease;
    }

    .emoji-sticker-tray.open { display: flex; }

    .tray-tabs {
      display: flex;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 10px;
      gap: 8px;
      align-items: center;
    }

    .tray-tab-btn {
      flex: 1;
      padding: 7px 10px;
      border-radius: 999px;
      border: none;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-dim);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tray-tab-btn.active {
      background: linear-gradient(135deg, #ff4ecd, #00e5ff);
      color: #091020;
    }

    .tray-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
    }

    .emoji-btn {
      background: transparent;
      border: none;
      font-size: 1.55rem;
      cursor: pointer;
      padding: 4px 0;
      border-radius: 10px;
      transition: transform 0.12s, background 0.15s;
    }

    .emoji-btn:active { transform: scale(1.25); background: rgba(255, 255, 255, 0.12); }

    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .sticker-pick-btn {
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      padding: 10px 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: transform 0.14s;
    }

    .sticker-pick-btn:active { transform: scale(0.92); }
    .sticker-pick-btn span.st-ico { font-size: 2rem; line-height: 1.1; }
    .sticker-pick-btn span.st-txt { font-size: 0.7rem; font-weight: 700; color: #fff; }

    /* Bottom Input Bar */
    .chat-input-bar {
      position: relative;
      padding: 9px 10px 13px;
      background: rgba(16, 18, 38, 0.94);
      border-top: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .msg-input {
      flex: 1;
      min-width: 0;
      padding: 11px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .msg-input::placeholder { color: rgba(255, 255, 255, 0.45); }

    .mini-circle-btn {
      width: 39px;
      height: 39px;
      border-radius: 50%;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .mini-circle-btn:active { transform: scale(0.9); }
    .btn-emoji { background: rgba(255, 214, 0, 0.2); color: #ffe066; }
    .btn-attach { background: rgba(255, 78, 205, 0.22); color: #ff9be4; }

    .send-wrap { position: relative; flex-shrink: 0; }

    .send-circle-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #00f59b, #00e5ff);
      color: #061422;
      font-size: 1.05rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 229, 255, 0.35);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .send-circle-btn:active { transform: scale(0.9); }

<body>

    function playTone(freq = 660, duration = 0.14) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.14, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch {}
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 B';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function getFileIcon(mime, name) {
      const n = (name || '').toLowerCase();
      if (mime.startsWith('image/')) return 'fa-image';
      if (mime.startsWith('video/')) return 'fa-film';
      if (mime.startsWith('audio/')) return 'fa-music';
      if (mime.includes('pdf') || n.endsWith('.pdf')) return 'fa-file-pdf';
      if (n.endsWith('.zip') || n.endsWith('.rar') || n.endsWith('.7z')) return 'fa-file-zipper';
      if (n.endsWith('.doc') || n.endsWith('.docx')) return 'fa-file-word';
      if (n.endsWith('.xls') || n.endsWith('.xlsx')) return 'fa-file-excel';
      if (n.endsWith('.ppt') || n.endsWith('.pptx')) return 'fa-file-powerpoint';
      return 'fa-file-lines';
    }

        a.href = url;
        a.download = fileName || 'download';

        a.click();

        setTimeout(() => URL.revokeObjectURL(url), 4000);

      if (!calcStr) return;

        document.getElementById('calc-expr').textContent = calcStr + " =";
        calcStr = String(Number.isFinite(ans) ? +parseFloat(ans).toFixed(6) : "Error");

    // ================= 6. SWIPE-RIGHT TO REPLY & LONG-PRESS MENU =================
    function attachBubbleGestures(rowEl, bubbleEl, msgId) {
      let startX = 0, startY = 0, curX = 0;
      let isSwiping = false;
      let holdTimer = null;
      const hint = rowEl.querySelector('.swipe-reply-hint');

      const onStart = (clientX, clientY, target) => {
        if (target.closest('button, video, audio')) return;
        startX = clientX;
        startY = clientY;
        curX = 0;
        isSwiping = false;

        holdTimer = setTimeout(() => {
          holdTimer = null;
          if (!isSwiping) openActionSheet(msgId);
        }, 460);
      };

      const onMove = (clientX, clientY) => {
        const dx = clientX - startX;
        const dy = clientY - startY;

        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
          clearTimeout(holdTimer);
          holdTimer = null;
        }

        if (dx > 12 && Math.abs(dx) > Math.abs(dy) * 1.35) {
          isSwiping = true;
          curX = Math.min(dx * 0.65, 68);
          bubbleEl.style.transition = 'none';
          bubbleEl.style.transform = `translateX(${curX}px)`;
          if (hint) {
            hint.style.opacity = String(Math.min(1, curX / 45));
            hint.style.transform = `scale(${0.6 + Math.min(0.45, curX / 120)})`;
          }
        }
      };

      const onEnd = () => {
        clearTimeout(holdTimer);
        holdTimer = null;
        if (isSwiping) {
          bubbleEl.style.transition = 'transform 0.22s ease';
          bubbleEl.style.transform = 'translateX(0)';
          if (hint) {
            hint.style.opacity = '0';
            hint.style.transform = 'scale(0.6)';
          }
          if (curX >= 42) {
            const info = messageStore.get(msgId);
            if (info && !info.oneTime) {
              if (navigator.vibrate) navigator.vibrate(30);
              startReply(info);
            }
          }
          isSwiping = false;
        }
      };

      bubbleEl.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) onStart(e.touches[0].clientX, e.touches[0].clientY, e.target);
      }, { passive: true });

      bubbleEl.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) onMove(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });

      bubbleEl.addEventListener('touchend', onEnd);
      bubbleEl.addEventListener('touchcancel', onEnd);

      // Desktop right-click support
      bubbleEl.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        openActionSheet(msgId);
      });
    }

    function chooseOneTimeSend() {
      closeSendPopup();
      const hasText = msgInput.value.trim().length > 0;
      if (pendingFile || hasText) {
        executeSend(true);
        oneTimeSticky = false;
      } else {
        oneTimeSticky = true;
        showToast("One-Time (1x) mode ON!");
      }
      updateSendBtnVisual();
    }

    function chooseNormalSend() {
      closeSendPopup();
      oneTimeSticky = false;
      updateSendBtnVisual();
      const hasText = msgInput.value.trim().length > 0;
      if (pendingFile || hasText) executeSend(false);
      else showToast("Normal Seen-Once mode ON.");
    }

    function handlePrimarySend() {
      if (editingMsgId) {
        submitEdit();
        return;
      }
      executeSend(oneTimeSticky);
      if (oneTimeSticky) {
        oneTimeSticky = false;
        updateSendBtnVisual();
      }
    }

    function executeSend(isOneTime) {
      const text = msgInput.value.trim();
      const replyPayload = activeReply;

      if (pendingFile) {
        socket.emit('send_file', {
          fileData: pendingFile.fileData,
          fileName: pendingFile.fileName,
          fileType: pendingFile.fileType,
          fileSize: pendingFile.fileSize,
          oneTime: isOneTime,
          autoHide: autoHideAfterSeen,
          replyTo: replyPayload
        });
        clearPendingFile();
        cancelReply();
      }

      if (text) {
        socket.emit('send_message', {
          text,
          autoHide: autoHideAfterSeen,
          oneTime: isOneTime,
          replyTo: replyPayload
        });
        socket.emit('typing', { isTyping: false });
        msgInput.value = "";
        cancelReply();
      }
    }

    function buildCanvasFilterString() {
      const f = VIDEO_FILTERS.find(x => x.id === activeFilterId) || VIDEO_FILTERS[0];
      const bright = (lightLevel / 100).toFixed(2);
      return `brightness(${bright}) ${f.css}`.trim();
    }

    function drawFilteredFrame() {
      if (!isPipelineRunning) return;
      const rawVideo = document.getElementById('raw-camera-video');
      const canvas = document.getElementById('filter-canvas');
      const ctx = canvas.getContext('2d');

      if (isCamOff) {
        ctx.save();
        if ('filter' in ctx) ctx.filter = 'none';
        ctx.fillStyle = '#0d1024';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Camera Off', canvas.width / 2, canvas.height / 2);
        ctx.restore();
      } else if (rawVideo.readyState >= 2 && rawVideo.videoWidth > 0) {
        const maxDim = 640;
        const vw = rawVideo.videoWidth;
        const vh = rawVideo.videoHeight;
        const scale = Math.min(1, maxDim / Math.max(vw, vh));
        const tw = Math.round(vw * scale);
        const th = Math.round(vh * scale);
        if (canvas.width !== tw || canvas.height !== th) {
          canvas.width = tw;
          canvas.height = th;
        }

        // Base frame with light & color filter
        ctx.save();
        if ('filter' in ctx) ctx.filter = buildCanvasFilterString();
        ctx.drawImage(rawVideo, 0, 0, canvas.width, canvas.height);
        ctx.restore();

        // Face Smooth soft-glow pass
        if (faceSmoothLevel > 0 && 'filter' in ctx) {
          ctx.save();
          const blurPx = 1.6 + (faceSmoothLevel / 100) * 4.2;
          const alpha = (faceSmoothLevel / 100) * 0.40;
          ctx.globalAlpha = alpha;
          ctx.filter = `blur(${blurPx.toFixed(1)}px) brightness(${(lightLevel / 100 * 1.04).toFixed(2)}) saturate(1.06)`;
          ctx.drawImage(rawVideo, 0, 0, canvas.width, canvas.height);
          ctx.restore();
        }
      }

      renderLoopId = requestAnimationFrame(drawFilteredFrame);
    }

    async function startLocalMedia(type) {
      const constraints = {
        audio: true,
        video: type === 'video'
          ? { facingMode: currentFacing, width: { ideal: 640 }, height: { ideal: 480 } }
          : false
      };

      rawStream = await navigator.mediaDevices.getUserMedia(constraints);

      if (type === 'audio') {
        processedStream = rawStream;
        return processedStream;
      }

      const rawVideo = document.getElementById('raw-camera-video');
      const canvas = document.getElementById('filter-canvas');
      rawVideo.srcObject = new MediaStream(rawStream.getVideoTracks());

      await new Promise((resolve) => {
        const done = () => {
          rawVideo.removeEventListener('loadedmetadata', done);
          resolve();
        };
        if (rawVideo.readyState >= 1) resolve();
        else rawVideo.addEventListener('loadedmetadata', done);
      });
      try { await rawVideo.play(); } catch {}

      // Set initial canvas size from camera feed
      const vw = rawVideo.videoWidth || 480;
      const vh = rawVideo.videoHeight || 640;
      const scale = Math.min(1, 640 / Math.max(vw, vh));
      canvas.width = Math.round(vw * scale);
      canvas.height = Math.round(vh * scale);

      if (typeof canvas.captureStream === 'function') {
        isPipelineRunning = true;
        drawFilteredFrame();
        const canvasStream = canvas.captureStream(25);
        processedStream = new MediaStream([
          ...canvasStream.getVideoTracks(),
          ...rawStream.getAudioTracks()
        ]);
      } else {
        processedStream = rawStream;
      }

      const localVideo = document.getElementById('local-video');
      localVideo.srcObject = processedStream;
      localVideo.style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
      return processedStream;
    }

    // ================= 14. WEBRTC VOICE & VIDEO CALL =================
    function createPeerConnection() {
      const pc = new RTCPeerConnection(rtcConfig);
      pc.onicecandidate = (e) => {
        if (e.candidate) socket.emit('webrtc_ice', { candidate: e.candidate });
      };
      pc.ontrack = (e) => {
        document.getElementById('remote-video').srcObject = e.streams[0];
      };
      if (processedStream) {
        processedStream.getTracks().forEach(t => pc.addTrack(t, processedStream));
      }
      return pc;
    }

    function showCallUI(stateText, showIncoming, callType) {
      const overlay = document.getElementById('call-overlay');
      overlay.classList.remove('hidden');
      document.getElementById('call-peer-name').textContent = partnerName;
      document.getElementById('call-avatar').textContent = partnerName.charAt(0).toUpperCase();
      document.getElementById('call-state-text').textContent = stateText;

      document.getElementById('incoming-controls').classList.toggle('hidden', !showIncoming);
      document.getElementById('active-controls').classList.toggle('hidden', showIncoming);

      const isVid = callType === 'video';
      document.getElementById('remote-video').style.display = isVid ? 'block' : 'none';
      document.getElementById('local-video').style.display = isVid ? 'block' : 'none';
      document.getElementById('btn-cam').style.display = isVid ? 'flex' : 'none';
      document.getElementById('btn-flip').style.display = isVid ? 'flex' : 'none';
      document.getElementById('btn-filter').style.display = isVid ? 'flex' : 'none';
      if (!isVid) document.getElementById('filter-panel').classList.remove('open');
    }

    async function initiateCall(type) {
      if (!partnerOnline) {
        showToast("Partner abhi offline hai! Pehle Knock bhejo.");
        return;
      }
      currentCallType = type;
      try {
        await startLocalMedia(type);
        showCallUI(type === 'video' ? "Video Calling..." : "Voice Calling...", false, type);
        socket.emit('call_request', { callType: type });
      } catch {
        showToast("Camera/Mic permission allow karo (HTTPS zaroori hai)");
      }
    }

    socket.on('incoming_call', (data) => {
      currentCallType = data.callType;
      partnerName = data.callerName || partnerName;
      playTone(820, 0.25);
      if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
      showSystemNotification("Study Reminder", "Live study session start ho gaya hai.");
      showCallUI(
        data.callType === 'video' ? "Incoming Video Call..." : "Incoming Voice Call...",
        true,
        data.callType
      );
    });

    async function acceptCall() {
      try {
        await startLocalMedia(currentCallType);
        peerConn = createPeerConnection();
        showCallUI("Connected • Live", false, currentCallType);
        if (currentCallType === 'video') document.getElementById('call-top-info').style.opacity = '0.28';
        socket.emit('call_accept', { callType: currentCallType });
      } catch {
        showToast("Camera/Mic access fail hua!");
        rejectCall();
      }
    }

    function rejectCall() {
      socket.emit('call_reject');
      endCall(false);
    }

    socket.on('call_rejected', () => {
      showToast("Partner ne call cut kar diya.");
      endCall(false);
    });

    socket.on('call_accepted', async () => {
      peerConn = createPeerConnection();
      const offer = await peerConn.createOffer();
      await peerConn.setLocalDescription(offer);
      document.getElementById('call-state-text').textContent = "Connected • Live";
      if (currentCallType === 'video') document.getElementById('call-top-info').style.opacity = '0.28';
      socket.emit('webrtc_offer', { offer });
    });

    socket.on('webrtc_offer', async (data) => {
      if (!peerConn) peerConn = createPeerConnection();
      await peerConn.setRemoteDescription(new RTCSessionDescription(data.offer));
      for (const c of pendingIceCandidates) await peerConn.addIceCandidate(new RTCIceCandidate(c));
      pendingIceCandidates = [];
      const answer = await peerConn.createAnswer();
      await peerConn.setLocalDescription(answer);
      socket.emit('webrtc_answer', { answer });
    });

    socket.on('webrtc_answer', async (data) => {
      if (peerConn) {
        await peerConn.setRemoteDescription(new RTCSessionDescription(data.answer));
        for (const c of pendingIceCandidates) await peerConn.addIceCandidate(new RTCIceCandidate(c));
        pendingIceCandidates = [];
      }
    });

    socket.on('webrtc_ice', async (data) => {
      if (peerConn && peerConn.remoteDescription) {
        try { await peerConn.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch {}
      } else {
        pendingIceCandidates.push(data.candidate);
      }
    });

    socket.on('call_ended', () => endCall(false));

    function endCall(notifyPeer) {
      if (notifyPeer) socket.emit('call_end');
      isPipelineRunning = false;
      if (renderLoopId) { cancelAnimationFrame(renderLoopId); renderLoopId = null; }
      if (peerConn) { peerConn.close(); peerConn = null; }
      if (rawStream) { rawStream.getTracks().forEach(t => t.stop()); rawStream = null; }
      if (processedStream) { processedStream.getTracks().forEach(t => t.stop()); processedStream = null; }

      document.getElementById('raw-camera-video').srcObject = null;
      document.getElementById('remote-video').srcObject = null;
      document.getElementById('local-video').srcObject = null;
      document.getElementById('call-overlay').classList.add('hidden');
      document.getElementById('filter-panel').classList.remove('open');
      document.getElementById('btn-filter').classList.remove('magic-on');
      document.getElementById('call-top-info').style.opacity = '1';
      if (ringLightOn) toggleRingLight();

      pendingIceCandidates = [];
      isSwitchingCam = false;
      isMuted = false;
      isCamOff = false;
      currentFacing = 'user';
      document.getElementById('btn-mute').classList.remove('muted');
      document.getElementById('btn-cam').classList.remove('muted');
    }

    function toggleMute() {
      if (!rawStream) return;
      isMuted = !isMuted;
      rawStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
      const btn = document.getElementById('btn-mute');
      btn.classList.toggle('muted', isMuted);
      btn.innerHTML = isMuted ? '<i class="fa-solid fa-microphone-slash"></i>' : '<i class="fa-solid fa-microphone"></i>';
    }

    function toggleCamera() {
      if (!rawStream) return;
      isCamOff = !isCamOff;
      rawStream.getVideoTracks().forEach(t => t.enabled = !isCamOff);
      const btn = document.getElementById('btn-cam');
      btn.classList.toggle('muted', isCamOff);
      btn.innerHTML = isCamOff ? '<i class="fa-solid fa-video-slash"></i>' : '<i class="fa-solid fa-video"></i>';
    }

    // FIXED: Hardware-safe Camera Switch (works repeatedly without freezing)
    async function switchCamera() {
      if (!rawStream || currentCallType !== 'video' || isSwitchingCam) return;
      isSwitchingCam = true;
      const flipBtn = document.getElementById('btn-flip');
      flipBtn.style.opacity = '0.45';

      const targetFacing = currentFacing === 'user' ? 'environment' : 'user';
      const oldVideoTracks = rawStream.getVideoTracks();
      const oldDeviceId = oldVideoTracks[0]?.getSettings?.()?.deviceId;

      // 1. Pehle purana camera track STOP karo taaki mobile hardware sensor release ho jaye
      oldVideoTracks.forEach(track => {
        track.stop();
        rawStream.removeTrack(track);
      });

      // 2. Mobile camera HAL ko release hone ke liye 180ms gap
      await new Promise(r => setTimeout(r, 180));

      let newVideoStream = null;

      // Attempt A: Exact facingMode
      try {
        newVideoStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { exact: targetFacing }, width: { ideal: 640 }, height: { ideal: 480 } }
        });
      } catch {
        // Attempt B: Available video cameras list mein se agla camera pick karo
        try {
          const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
          if (devices.length > 1) {
            const curIdx = devices.findIndex(d => d.deviceId === oldDeviceId);
            const nextDev = devices[(curIdx + 1) % devices.length];
            newVideoStream = await navigator.mediaDevices.getUserMedia({
              audio: false,
              video: { deviceId: { exact: nextDev.deviceId }, width: { ideal: 640 }, height: { ideal: 480 } }
            });
          }
        } catch {}
      }

      // Attempt C: Soft facingMode fallback
      if (!newVideoStream) {
        try {
          newVideoStream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { facingMode: targetFacing }
          });
        } catch {
          // Recovery: wapas default camera kholo taaki screen black na rahe
          try {
            newVideoStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
          } catch {}
        }
      }

      if (newVideoStream && newVideoStream.getVideoTracks().length > 0) {
        const newTrack = newVideoStream.getVideoTracks()[0];
        newTrack.enabled = !isCamOff;
        rawStream.addTrack(newTrack);

        const actualFacing = newTrack.getSettings?.()?.facingMode;
        currentFacing = (actualFacing === 'environment' || actualFacing === 'user') ? actualFacing : targetFacing;

        const rawVideo = document.getElementById('raw-camera-video');
        rawVideo.srcObject = new MediaStream([newTrack]);
        try { await rawVideo.play(); } catch {}

        // Agar browser canvas.captureStream support nahi karta toh direct track replace karo
        if (!isPipelineRunning && peerConn) {
          const sender = peerConn.getSenders().find(s => s.track && s.track.kind === 'video');
          if (sender) await sender.replaceTrack(newTrack);
          document.getElementById('local-video').srcObject = new MediaStream([newTrack]);
        }

        document.getElementById('local-video').style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
        showToast(currentFacing === 'user' ? "Front Camera ON" : "Back Camera ON");
      } else {
        showToast("Camera switch nahi hua — ek baar aur tap karo");
      }

      flipBtn.style.opacity = '1';
      isSwitchingCam = false;
    }
  </script>
